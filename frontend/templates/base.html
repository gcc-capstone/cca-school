<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Pigeon Connect{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">

  <nav class="navbar navbar-expand-lg bg-primary shadow-sm sticky-top d-print-none" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="{{ url_for('main.index') }}">
        <span class="bg-white rounded p-1 d-inline-flex">
          <img src="{{ url_for('static', filename='images/logo.png') }}" alt="" width="28" height="28">
        </span>
        Pigeon Connect
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
              aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav ms-auto gap-lg-1 py-2 py-lg-0">
          {% block nav %}
          <li class="nav-item">
            <a class="nav-link px-3 rounded {{ 'active fw-semibold' if request.endpoint == 'main.index' }}"
               href="{{ url_for('main.index') }}"><i class="bi bi-house-door me-1"></i>Home</a>
          </li>
          {% endblock %}
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-body border-top py-4 mt-auto d-print-none">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 small text-body-secondary">
      <span>&copy; {{ current_year }} Pigeon Connect &middot; Central Christian Academy</span>
      <span>Grove City College Capstone</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
